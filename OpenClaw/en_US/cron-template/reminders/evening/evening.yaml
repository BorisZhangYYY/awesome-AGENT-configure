# Evening reminder scene
# This file is an example configuration; see ../../template-cron.yaml for more fields to override as needed.
templateRef: "../../template-cron.yaml"

variables:
  JOB_NAME: "【AAC-Reminder】Evening"
  CATEGORY: "Reminder"
  AGENT_ID: "main"
  LOCALE: "en_US"
  DESCRIPTION: "Evening greeting reminder, once per day, fires only between 21:00 and 23:30."

  SCHEDULE_EXPR: "0 22 * * *"
  WINDOW_START: "21:00"
  WINDOW_END: "23:30"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/reminder-evening.txt"

  # Trigger: use the built-in time_window.js script library to check time windows and deduplication outside the Prompt
  TRIGGER_ENABLED: "true"

  # Reminder tasks disable thinking to save tokens
  THINKING: "off"
  # Reminder tasks need to fire on time; disable automatic stagger
  EXACT: "true"

  SCENE_NAME: "Evening"
  EMOJI: "🌙"
  PERSONA_ROLE: "a calm intelligent assistant"
  TONE: "soothing, quiet, and warm"
  REMARK: "It is late; may you have sweet dreams and see you tomorrow."

  SCENE_SPECIFIC_INSTRUCTIONS: |
    You are responsible for giving the user an evening greeting at the appropriate time.

    **Greeting rules**
    - Tone: {{TONE}}
    - Length: 2-3 sentences; do not write an essay
    - Must include: the current time, today's date, and the day of the week
    - May include: {{REMARK}}

    **Output example**
    ```
    {{EMOJI}} {{SCENE_NAME}}!
    It is now <current time from `date +%H:%M` via exec>, <current date from `date +%Y-%m-%d` via exec>, <weekday from `LC_TIME=C date +%A` via exec>.
    {{REMARK}}
    ```
