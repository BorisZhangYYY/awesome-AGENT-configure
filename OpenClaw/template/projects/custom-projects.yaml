# 自定义项目场景（复制此文件后按需修改）
# ============================================================
# 本文件为通用项目模板，用于通过 Loop 方法自动推进任意软件项目任务。
# 适用于：
#   - 新功能开发
#   - 代码重构
#   - 技术债务清理
#   - 任何需要状态续传、按里程碑推进的项目工作
#
# 使用方式：
#   python3 OpenClaw/scripts/build-cron.py OpenClaw/template/projects/custom-projects.yaml

templateRef: "../template-cron.zh.yaml"

variables:
  # ========== 模式开关 ==========
  # 启用 Loop 模式（状态驱动迭代）
  LOOP_MODE_ENABLED: "true"

  # ========== 基础信息 ==========
  # 任务名称，建议使用：【AAC-项目】项目名-任务名
  JOB_NAME: "【AAC-项目】XXX 自定义项目任务"
  CATEGORY: "项目"
  DESCRIPTION: "通过 Loop 方法定时推进项目任务，按里程碑推进，达成目标后可自动停用"

  # ========== 调度配置 ==========
  # 项目任务建议在工作日的上午/下午触发
  SCHEDULE_EXPR: "0 10 * * 1-5"
  TIMEZONE: "Asia/Shanghai"
  WINDOW_START: "09:00"
  WINDOW_END: "12:00"

  # ========== 项目任务配置 ==========
  # 项目名称（用于汇报和日志）
  DEV_PROJECT_NAME: "MyProject"
  # 项目绝对路径（必须修改为你的实际路径）
  DEV_PROJECT_DIR: "/path/to/your/project"
  # 当前阶段标识（用于提交信息）
  DEV_PHASE: "Phase 1"
  # 开发分支名称
  DEV_BRANCH: "main"
  # 状态文件路径（用于续传）
  DEV_STATE_FILE: "{{DEV_PROJECT_DIR}}/.state/dev-custom-session.json"
  # 测试文件匹配模式
  DEV_TEST_PATTERN: "test_*.py"
  # Git 提交前缀（常见：feat/fix/refactor/maint/docs/test/chore）
  DEV_COMMIT_PREFIX: "feat"

  # 项目文档目录（用于读取/更新架构文档等）
  DEV_DOCS_DIR: "{{DEV_PROJECT_DIR}}/docs"

  # ========== 目标与里程碑 ==========
  # 总体目标：一句话描述本次要达成的最终成果
  DEV_GOAL: "完成 XXX 项目任务"
  # 里程碑列表：按顺序拆解目标，每个里程碑应可独立验收
  # 必须为合法 JSON 数组字符串，如：'["里程碑 1：...", "里程碑 2：..."]'
  DEV_MILESTONES: '["里程碑 1：任务分析与准备", "里程碑 2：核心实现", "里程碑 3：验证与收尾"]'
  # 当前里程碑名称（仅用于展示，真实索引以状态文件为准）
  DEV_CURRENT_MILESTONE: "里程碑 1：任务分析与准备"
  # 达成最终目标后是否自动停用 cron 任务（推荐一次性冲刺设为 true；持续性维护设为 false）
  DEV_AUTO_DISABLE_ON_GOAL_REACHED: "true"

  # ========== 场景特定指令 ==========
  # 这里定义当前项目任务的具体执行指令
  # 请根据你的实际项目填写以下内容
  DEV_TASK_INSTRUCTIONS: |
    ### 当前项目任务：XXX

    **任务目标**：
    1. ...
    2. ...

    **执行步骤**（分迭代执行，每次只完成一小步）：

    #### 迭代 1：分析与准备
    - 读取相关文档和代码
    - 明确验收标准
    - 更新 TODO.md

    #### 迭代 2：核心实现
    - ...

    #### 迭代 3：验证与收尾
    - 运行测试
    - 更新文档
    - git commit（不 push）

    **当前里程碑完成标准**（满足以下全部即可认为当前里程碑完成）：
    1. 该里程碑涉及的核心代码已提交
    2. 相关测试全部通过
    3. TODO.md 中对应任务已标记完成

  # ========== 投递配置 ==========
  # 项目任务正常时静默，有进度或阻塞时汇报
  DELIVERY_MODE: "none"
  BEST_EFFORT: "true"
  CHANNEL: "last"

  # ========== 会话配置 ==========
  SESSION_TARGET: "isolated"
  TIMEOUT_SECONDS: "14400"  # 4 小时

  # ========== Agent 配置 ==========
  LIGHT_CONTEXT: "false"
  THINKING: "medium"
  TOOLS: "exec,read,write,edit,bash"

  # ========== 人设配置 ==========
  PERSONA_MODE: "file"
  PERSONA_FILE: "{{WORKSPACE}}/SOUL.md"

  # ========== 时间窗口 ==========
  TIME_WINDOW_ENABLED: "true"
  WINDOW_OUT_ACTION: "NO_REPLY"

  # ========== 去重配置 ==========
  # 项目任务通常不需要单日去重，因为可能一天多次迭代
  DEDUP_ENABLED: "false"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/dev-custom-dedup.txt"

  # ========== 高级选项 ==========
  EXACT: "false"

  # ========== 场景特定补充指令 ==========
  SCENE_SPECIFIC_INSTRUCTIONS: |
    **项目纪律**：
    1. 专注当前任务，不做无关改动
    2. 优先复用现有代码，不重复造轮子
    3. 任何涉及外部仓库的操作需先汇报
    4. 到达目标后不要自动开启新目标，等待用户介入
