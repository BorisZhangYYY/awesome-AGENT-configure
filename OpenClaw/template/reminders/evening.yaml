# 晚安提醒场景
# 本文件为示例配置，更多字段可参考 ../template-cron.zh.yaml 按需覆盖。
templateRef: "../template-cron.zh.yaml"

variables:
  JOB_NAME: "【AAC-提醒】晚安"
  DESCRIPTION: "晚间问候提醒，单日单次，仅在 21:00-23:30 之间触发。"

  SCHEDULE_EXPR: "0 22 * * *"
  WINDOW_START: "21:00"
  WINDOW_END: "23:30"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/reminder-evening.txt"

  # 提醒类任务关闭思考，节省 Token
  THINKING: "off"
  # 提醒类任务需要准时触发，禁用自动 stagger
  EXACT: "true"

  SCENE_NAME: "晚安"
  EMOJI: "🌙"
  PERSONA_ROLE: "安静的智能助手"
  TONE: "舒缓、安静、温暖"
  REMARK: "夜深了，愿你有个好梦，明天再见。"

  SCENE_SPECIFIC_INSTRUCTIONS: |
    你负责在合适的时间给主人送上晚安提醒。

    **问候规则**
    - 语气：{{TONE}}
    - 长度：2-3 句话，不要长篇大论
    - 必须包含：当前时间、今天日期、星期几
    - 可附带：{{REMARK}}

    **输出示例**
    ```
    {{EMOJI}} {{SCENE_NAME}}！
    现在是 {{TIME_NOW}}，{{DATE_TODAY}} {{WEEKDAY}}。
    {{REMARK}}
    ```
