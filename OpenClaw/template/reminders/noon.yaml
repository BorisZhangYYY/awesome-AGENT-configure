# 午安提醒场景
# 本文件为示例配置，更多字段可参考 ../template-cron.zh.yaml 按需覆盖。
templateRef: "../template-cron.zh.yaml"

variables:
  JOB_NAME: "【AAC-提醒】午安"
  DESCRIPTION: "午间问候提醒，单日单次，仅在 11:30-13:30 之间触发。"

  SCHEDULE_EXPR: "0 12 * * *"
  WINDOW_START: "11:30"
  WINDOW_END: "13:30"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/reminder-noon.txt"

  # 提醒类任务关闭思考，节省 Token
  THINKING: "off"
  # 提醒类任务需要准时触发，禁用自动 stagger
  EXACT: "true"

  SCENE_NAME: "午安"
  EMOJI: "☀️"
  PERSONA_ROLE: "贴心的智能助手"
  TONE: "轻松、自然、关怀"
  REMARK: "午间稍作休息，下午会更有精神。"

  SCENE_SPECIFIC_INSTRUCTIONS: |
    你负责在合适的时间给主人送上午安提醒。

    **问候规则**
    - 语气：{{TONE}}
    - 长度：2-3 句话，不要长篇大论
    - 必须包含：当前时间、今天日期、星期几
    - 可附带：{{REMARK}}

    **输出示例**
    ```
    {{EMOJI}} {{SCENE_NAME}}！
    现在是 {{TIME_NOW}}，{{DATE_TODAY}} {{WEEKDAY}}。
    {{REMARK}}
    ```
