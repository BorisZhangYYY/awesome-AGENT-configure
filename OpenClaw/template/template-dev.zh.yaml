# 通用 OpenClaw 开发迭代模板（Loop 方法）
# ============================================================
# 本模板将 Loop 思想（状态驱动 + 清单驱动 + 增量迭代）融入 OpenClaw Cron，
# 支持 AI AGENT 通过定时任务自动推进软件开发项目。
#
# 与 template-cron.zh.yaml 的关系：
#   - 继承：时间窗口、单日去重、人设注入等 Harness 机制
#   - 扩展：状态管理（session.json）、清单驱动（START/EXIT）、增量迭代
#
# 适用场景：
#   - 功能开发（feat）：开发新特性
#   - 维护会话（maint）：回归测试、技术债务清理
#   - 重构（refactor）：代码重构、架构调整
#   - 调研（research）：技术调研、原型验证
#
# 设计原则：
#   1. 每次 cron 触发 = 一个完整的开发迭代（START → DEV → EXIT）
#   2. 状态文件是"续传"的关键，确保跨会话连续性
#   3. 清单是质量保障，不执行完 EXIT 不算完成
#   4. 增量迭代：每次只做一小块，积累到完整功能
#   5. 安全红线：push 前人工审核，模板只负责 commit

name: "{{JOB_NAME}}"
category: "{{CATEGORY}}"
description: "{{DESCRIPTION}}"

# Agent 任务载荷
message: "{{MESSAGE}}"

# 调度配置
schedule:
  type: "{{SCHEDULE_TYPE}}"
  expr: "{{SCHEDULE_EXPR}}"
  timezone: "{{TIMEZONE}}"

# 时间窗口保护【继承 template-cron.zh.yaml】
timeWindow:
  enabled: "{{TIME_WINDOW_ENABLED}}"
  start: "{{WINDOW_START}}"
  end: "{{WINDOW_END}}"
  action: "{{WINDOW_OUT_ACTION}}"

# 单日去重【开发类任务通常不需要单日去重，因为可能一天多次迭代】
deduplication:
  enabled: "{{DEDUP_ENABLED}}"
  stateFile: "{{DEDUP_STATE_FILE}}"

# 人设配置
persona:
  mode: "{{PERSONA_MODE}}"
  file: "{{PERSONA_FILE}}"
  role: "{{PERSONA_ROLE}}"

# 投递配置
delivery:
  mode: "{{DELIVERY_MODE}}"
  channel: "{{CHANNEL}}"
  to: "{{TO}}"
  threadId: "{{THREAD_ID}}"
  bestEffort: "{{BEST_EFFORT}}"

# 会话配置
session:
  target: "{{SESSION_TARGET}}"
  persistentId: "{{PERSISTENT_ID}}"
  timeoutSeconds: "{{TIMEOUT_SECONDS}}"

# Agent 执行上下文
context:
  lightContext: "{{LIGHT_CONTEXT}}"

# Agent 配置
agent:
  agentId: "{{AGENT_ID}}"
  model: "{{MODEL}}"
  thinking: "{{THINKING}}"
  tools: "{{TOOLS}}"

# 高级选项
advanced:
  disabled: "{{DISABLED}}"
  deleteAfterRun: "{{DELETE_AFTER_RUN}}"
  exact: "{{EXACT}}"
  stagger: "{{STAGGER}}"

# ============================================================
# 开发迭代模板（核心）
# ============================================================
# 以下 template 将 Loop 思想渲染为 Agent 可执行的 Prompt。
# 阶段划分：
#   PHASE 0 — 前置检查（Harness 机制）
#   PHASE 1 — START：读取状态，判断会话类型
#   PHASE 2 — DEV：执行开发任务
#   PHASE 3 — EXIT：保存状态，代码收尾，文档更新
# ============================================================

template: |
  {{PERSONA_PROMPT}}

  你负责通过定时任务自动推进软件开发项目。

  **项目信息**
  - 项目名称：{{DEV_PROJECT_NAME}}
  - 项目目录：`{{DEV_PROJECT_DIR}}`
  - 当前阶段：{{DEV_PHASE}}
  - 开发分支：{{DEV_BRANCH}}

  ---

  ## PHASE 0：前置检查（Harness 机制）

  **【防护机制 1：时间窗口】**
  本机制仅当 `{{TIME_WINDOW_ENABLED}}` 为 true 时生效。
  执行：用 exec 工具运行 `TZ={{TIMEZONE}} date +%H:%M`，获取当前本地时间。
  将结果解析为 HH:MM 格式：
  - 如果当前时间在 {{WINDOW_START}} 到 {{WINDOW_END}} 之间：继续执行
  - 否则：执行窗口外动作 `{{WINDOW_OUT_ACTION}}`；若为 `NO_REPLY`，立即输出 `NO_REPLY` 并结束

  **【防护机制 2：单日去重】**
  本机制仅当 `{{DEDUP_ENABLED}}` 为 true 时生效。
  读取状态文件 {{DEDUP_STATE_FILE}}。
  用 exec 工具运行 `date +%Y-%m-%d`（或 `TZ={{TIMEZONE}} date +%Y-%m-%d`），获取今天日期。
  若文件中已存在该日期，立即输出 `NO_REPLY`，结束运行。

  ---

  ## PHASE 1：START — 会话启动

  > 先读，再想，后动手。磨刀不误砍柴工。

  ### 步骤 1.1：读取开发状态

  读取状态文件：`{{DEV_STATE_FILE}}`

  状态文件为 JSON 格式，关键字段：
  - `status`: `ready` | `in_progress` | `blocked`
  - `current_card`: 当前进行中的任务卡片标识
  - `last_session`: 上次会话时间（ISO-8601）
  - `next_step`: 下次要做什么（具体、可执行）
  - `blockers`: 阻塞项列表
  - `tech_debt`: 技术债务列表
  - `test_coverage`: 当前测试覆盖情况
  - `dev_log`: 开发日志（每次会话追加）

  如果状态文件不存在，视为首次开发会话，初始化状态：
  ```json
  {
    "status": "ready",
    "current_card": null,
    "last_session": null,
    "next_step": "认领第一个开发任务",
    "blockers": [],
    "tech_debt": [],
    "test_coverage": "未评估",
    "dev_log": []
  }
  ```

  ### 步骤 1.2：读取项目 TODO

  读取 `{{DEV_PROJECT_DIR}}/TODO.md`（如果存在），了解：
  - 已完成项（标记为 `[x]`）
  - 未完成项（标记为 `[ ]`）
  - 当前优先级最高的任务

  ### 步骤 1.3：读取最近提交历史

  执行：
  ```bash
  cd {{DEV_PROJECT_DIR}} && git log --oneline -5
  ```
  了解代码最新进展。

  ### 步骤 1.4：判断会话类型

  根据 `status` 字段：

  ```
  status = "ready"
    → 新任务：认领最优先的待办项
    → 从 TODO.md 或 Workboard 中找到下一个要完成的任务
    → 更新 current_card 为该任务标识
    → status 改为 "in_progress"

  status = "in_progress"
    → 续传：读取 current_card 和 next_step，继续编码
    → 加载上次中断的上下文

  status = "blocked"
    → 先解阻塞：检查 blocker 内容
    → 限时解决（≤15分钟），超时则记录并跳过
    → 若阻塞解除，status 改为 "in_progress"
  ```

  ### 步骤 1.5：加载开发上下文

  根据当前任务，读取相关代码文件：
  - 当前任务关联的源代码文件
  - 对应的测试文件（`test_*.py` 或对应模式）
  - `requirements.txt` 或依赖配置
  - 架构文档（如 `docs/architecture*.md`）

  ---

  ## PHASE 2：DEV — 执行开发任务

  > 专注当前任务，不做无关改动。

  ### 开发纪律（必须遵守）

  1. **最少改动原则**：只碰任务直接相关的代码
  2. **匹配现有风格**：即使自己习惯不同
  3. **清理孤儿代码**：未使用的 import / 变量 / 函数，由我的改动造成的，必须删除
  4. **验证闭环**：
     - 修 bug → 先复现，再修复，再验证
     - 加功能 → 先定义成功标准，完成后再验证
  5. **简单优先**：50 行能搞定的不写 200 行

  ### 执行步骤

  {{DEV_TASK_INSTRUCTIONS}}

  ### 测试验证

  开发完成后必须运行测试：
  ```bash
  cd {{DEV_PROJECT_DIR}}
  # 语法检查
  python -m py_compile <修改的文件>
  # 运行相关测试
  python -m pytest {{DEV_TEST_PATTERN}} -v
  ```
  记录测试结果（通过数/总数）。

  ---

  ## PHASE 3：EXIT — 会话退出

  > 保存状态，记录债务，以待来日。代码是临时文件，状态记录才是永恒。

  ### 步骤 3.1：代码收尾

  - [ ] 运行 `python -m py_compile` 检查语法错误
  - [ ] 运行相关测试：`python -m pytest {{DEV_TEST_PATTERN}} -v`
  - [ ] `git diff` — 确认变更范围合理，无意外文件被修改
  - [ ] `git status` — 确认无未提交的重要变更

  ### 步骤 3.2：安全审查

  检查新增/修改文件：
  - [ ] **无 API Key 硬编码** — 搜索 `api_key`, `token`, `password`, `secret`
  - [ ] **无私人路径泄露** — 搜索 `/home/`, `/Users/`, `C:\\`, 绝对路径
  - [ ] **无意外删除** — git diff 确认无 rm 操作
  - [ ] **无大型二进制文件** — 确认未提交 >1MB 文件

  ### 步骤 3.3：Git 提交

  ```bash
  cd {{DEV_PROJECT_DIR}}
  git add -A
  git commit -m "{{DEV_COMMIT_PREFIX}}: [{{DEV_PHASE}}] {{DEV_COMMIT_MESSAGE}} — $(date +%Y-%m-%d) 会话"
  ```

  **提交信息规范**：
  - 新功能：`feat: [P2-T3] Query 扩展与意图分类`
  - 修复：`fix: [P2-T1] 修复向量检索空结果异常`
  - 重构：`refactor: [P2] 提取公共工具函数`
  - 测试：`test: [P2-T3] 补充边界测试`
  - 维护：`maint: 2026-06-26 维护会话 — 测试验证`

  > ⚠️ **不执行 `git push`** — 按安全红线，push 前需人工审核

  ### 步骤 3.4：更新状态文件

  更新 `{{DEV_STATE_FILE}}`：
  - `last_session` → 当前时间（ISO-8601）
  - `current_card` → 本次完成的卡片（或进行中的卡片）
  - `status` → `in_progress`（未完）/ `ready`（完成，可领新任务）/ `blocked`（有阻塞）
  - `next_step` → 下次要做什么（具体、可执行）
  - `blockers` → 本次遇到的未解决阻塞
  - `tech_debt` → 本次产生的技术债务
  - `test_coverage` → 当前测试覆盖情况
  - `dev_log` → 追加本次会话记录

  ### 步骤 3.5：更新 TODO.md

  更新 `{{DEV_PROJECT_DIR}}/TODO.md`：
  - 标记已完成的项为 `[x]`
  - 新增发现的待办项
  - 更新「进行中」和「下次计划」

  ### 步骤 3.6：汇报（如配置了投递）

  如果 `{{DELIVERY_MODE}}` 为 `announce`，发送汇报消息：

  ```
  🗡️ 【{{DEV_PROJECT_NAME}}】开发迭代汇报

  时间：{{DATE_TODAY}} {{TIME_NOW}}
  任务：{{current_card}}
  状态：{{status}}

  完成项：
  - xxx

  测试：{{test_coverage}}

  债务：
  - {{tech_debt}}

  下次：{{next_step}}
  ```

  ---

  ## 状态机转换图

  ```
  +--------+     领新任务      +-------------+
  | ready  | ----------------> | in_progress |
  +--------+                   +-------------+
       ^                            | 完成/部分完成
       |                            v
       +-----------------------+ 遇到阻塞
                                 +---------+
                                 | blocked | ——→ 限时解阻塞（≤15min）
                                 +---------+      超时则保持 blocked
  ```

  ---

  **场景特定指令**
  {{SCENE_SPECIFIC_INSTRUCTIONS}}
