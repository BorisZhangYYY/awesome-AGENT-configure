# Docker 容器/Compose 巡检场景
# 本任务检查 Docker 容器运行状态、健康状态与近期日志。
# 若全部正常则静默（NO_REPLY），异常时发出告警。
#
# 使用方式：
#   python3 OpenClaw/scripts/build-cron.py OpenClaw/template/check/docker.yaml
#
# 通用模板仍使用 OpenClaw/template/template-cron.zh.yaml 中的变量默认值与字段结构，
# 本场景通过 `template` 字段直接覆盖提示词内容。
templateRef: "../template-cron.zh.yaml"

variables:
  JOB_NAME: "【AAC-巡检】Docker 容器健康"
  CATEGORY: "巡检"
  DESCRIPTION: "检查 Docker 容器与 Compose 项目的运行状态、健康状态及近期日志"

  SCHEDULE_EXPR: "0 */6 * * *"
  TIMEZONE: "Asia/Shanghai"
  WINDOW_START: "00:00"
  WINDOW_END: "23:59"

  # 巡检类任务正常时静默，异常时告警；不需要严格准时触发
  DELIVERY_MODE: "announce"
  BEST_EFFORT: "true"
  LIGHT_CONTEXT: "true"
  THINKING: "low"
  EXACT: "false"
  TIMEOUT_SECONDS: "300"
  TOOLS: "exec,read"

  # 去重默认关闭：同一异常可能持续多天，需要每天重复告警直到修复
  DEDUP_ENABLED: "false"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/inspection-docker.txt"

# 直接覆盖通用模板的提示词，写死 Docker 巡检逻辑
template: |
  你是一名 Docker 容器巡检专家，负责检查本机 Docker 容器与 Compose 项目的健康状态。

  **【防护机制 1：时间窗口】防止开机堆叠时非时段任务误触发【非官方】**
  用 exec 工具运行 `TZ={{TIMEZONE}} date +%H:%M` 获取当前本地时间。
  - 若当前时间在 {{WINDOW_START}} 到 {{WINDOW_END}} 之间，继续执行。
  - 否则输出 `NO_REPLY` 并结束。

  **【防护机制 2：单日去重】防止开机堆叠重复告警【非官方】**
  读取 `{{DEDUP_STATE_FILE}}`。若去重已启用且文件中已存在今天的日期，输出 `NO_REPLY` 并结束。

  **巡检任务**：{{JOB_NAME}}

  **执行步骤**：
  1. 使用 exec 运行 `docker ps --format '{{.Names}}: {{.Status}}'`，获取所有运行中容器列表。
  2. 对列表中每个容器：
     - 运行 `docker inspect --format='{{.State.Status}} {{.State.Health.Status}}' <容器名>` 检查状态。
     - 若状态包含 exited、dead、unhealthy、restarting，记录为异常。
     - 运行 `docker logs --since 10m --tail 50 <容器名>`，搜索 error/fatal/panic/exception/unhealthy 关键字。
  3. 若用户通过环境变量或工作区配置了 docker-compose.yml 路径，运行 `docker compose -f <路径> ps` 检查 compose 服务是否全部 running。
  4. 汇总结果：
     - 全部正常：输出 `NO_REPLY`，不发送任何消息。
     - 发现异常：输出 Markdown 告警，包含异常容器、状态、关键日志片段、建议操作。

  **输出示例（异常时）**
  ```markdown
  🚨 Docker 巡检发现异常

  - 容器：xxx
    - 状态：unhealthy
    - 关键日志：xxx
  - 建议：检查服务依赖或重启容器
  ```

  **执行后（若发送了告警）**
  用 write 工具将今天的日期写入 `{{DEDUP_STATE_FILE}}`。
