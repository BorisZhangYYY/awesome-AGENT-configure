# Cron 任务健康巡检场景
# 本任务每日巡检所有 cron 任务的运行状态，结合历史报告区分"新故障"与"已知持续问题"，
# 仅对新出现的异常进行告警和重试。巡检结果持久化到 docs/reports/ 供后续参考。
# 若全部正常或无新问题则静默（NO_REPLY）。
#
# 使用方式：
#   python3 OpenClaw/scripts/build-cron.py OpenClaw/template/checks/cron-check.yaml
templateRef: "../template-cron.zh.yaml"

variables:
  JOB_NAME: "【AAC-巡检】Cron 任务健康"
  CATEGORY: "巡检"
  DESCRIPTION: "每日巡检 cron 任务运行状态，结合历史报告区分新故障与已知问题"

  SCHEDULE_EXPR: "0 9 * * *"
  TIMEZONE: "Asia/Shanghai"
  WINDOW_START: "06:00"
  WINDOW_END: "23:59"

  DELIVERY_MODE: "announce"
  BEST_EFFORT: "true"
  CHANNEL: "last"
  LIGHT_CONTEXT: "true"
  THINKING: "medium"
  TOOLS: "exec,read,write"
  EXACT: "false"
  TIMEOUT_SECONDS: "600"

  # 去重开启：每天执行一次即可
  DEDUP_ENABLED: "true"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/check-cron-check.txt"

  SCENE_SPECIFIC_INSTRUCTIONS: |
    你负责每日检查所有 cron 任务的运行状态。核心理念：**对比历史报告，只关注新出现或发生变化的异常。**

    **巡检任务**：{{JOB_NAME}}
    **报告目录**：`{{WORKSPACE}}/docs/reports/cron-check/`

    ---

    ## 步骤 1：阅读历史报告

    列出最近 3 天的报告文件：
    ```bash
    ls -t {{WORKSPACE}}/docs/reports/cron-check/ 2>/dev/null | head -3
    ```
    用 read 读取这些报告，了解：
    - 最近哪些任务异常、失败原因是什么
    - 哪些异常已持续多天
    - 哪些上次异常但可能已恢复

    若报告目录不存在或为空，视为首次巡检，所有异常均为新问题。

    ## 步骤 2：获取全部 cron 任务状态

    使用 exec 运行 `openclaw cron list`，解析每个任务的 ID 和名称。
    跳过本条巡检任务自身（名称为 `{{JOB_NAME}}`）。

    对每个任务，使用 exec 运行 `openclaw cron info --id <任务ID>`，提取：
    - 最近执行状态（success / failed / timeout / skipped）
    - 最近执行时间
    - 失败原因（如有）
    - 下次计划执行时间（判断是否严重逾期：超过 schedule 周期 2 倍仍未执行）

    ## 步骤 3：上下文判定

    对比步骤 1 的历史报告，判定本次发现的每个异常：

    | 情况 | 判定 | 动作 |
    |------|------|------|
    | 本次异常，历史报告中无此任务 | **新故障** | 告警 + 尝试重试 |
    | 本次异常，原因与上次报告相同 | **已知持续问题** | 不重复告警，报告中标注持续天数 |
    | 本次异常，原因与上次报告**不同** | **问题已变化** | 告警（原因已变化） |
    | 历史报告中有异常，但本次正常 | **已恢复** | 不告警，报告中记录已恢复 |

    额外规则：
    - 若 nextRun 严重逾期，无论历史如何，均视为告警（任务可能卡死）
    - 若同一任务连续 7 天以上相同原因失败，报告中合并为一条提醒并建议人工排查

    ## 步骤 4：重试（仅对新故障）

    对新出现的失败任务，判断失败原因：
    - 失败原因为网络超时、API 限流、临时资源不足 → 在报告中标注「建议重试」，并执行 `openclaw cron run --wait <任务ID>` 立即重试一次，观察是否恢复。
    - 失败原因为配置错误、权限不足、脚本不存在 → 不重试，标记需人工介入

    ## 步骤 5：写入巡检报告

    报告路径：`{{WORKSPACE}}/docs/reports/cron-check/{{DATE_TODAY}}.md`

    无论有无新异常，均写入报告：

    ```markdown
    # 【AAC-巡检】Cron 任务健康 — {{DATE_TODAY}} {{TIME_NOW}}

    ## 摘要
    - 总任务数：X | 正常：Y | 异常：Z
    - 新异常：N 个 | 已恢复：M 个 | 已知持续：K 个

    ## 详情
    （若有新异常）
    ### 🆕 新异常
    | 任务名 | 状态 | 失败原因 | 重试结果 |
    |--------|------|----------|----------|
    | xxx | failed | 网络超时 | ✅ 已恢复 |

    （若有问题变化）
    ### 🔄 问题变化
    | 任务名 | 上次原因 | 本次原因 |
    |--------|----------|----------|

    （若有已恢复）
    ### ✅ 已恢复
    - zzz（上次：超时，本次：正常）

    （若有持续 >7 天的失败）
    ### ⚠️ 持续失败（>7 天，建议人工排查）
    - aaa：配置错误（已持续 10 天）

    （若无新异常）
    本次无新异常。已知持续问题 K 个（详见历史报告）。
    ```

    ## 步骤 6：清理 30 天前的旧报告

    ```bash
    mkdir -p {{WORKSPACE}}/.trash/ && find {{WORKSPACE}}/docs/reports/cron-check/ -name '*.md' -mtime +30 -exec mv {} {{WORKSPACE}}/.trash/ \; 2>/dev/null
    ```
    `{{WORKSPACE}}/.trash/` 目录不存在则先 `mkdir -p`。

    ---

    **若需要告警**（有新异常或问题变化），将步骤 5 报告的「详情」部分发送。
    **若无需告警**（无新异常或变化），输出 `NO_REPLY`。
