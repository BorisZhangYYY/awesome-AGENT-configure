# 通用 OpenClaw Cron 任务模板
# 本文件包含 OpenClaw 官方 CLI 参数映射、以及模板层 Harness/Loop 扩展。
# 标注为【非官方】的字段不是 OpenClaw 原生参数，由本模板用 Prompt 工具调用实现。
# 场景文件（如 reminders/morning.yaml）只需提供 variables；未提供的变量由生成器使用默认值填充。
#
# 本模板同时支持两种执行模式：
#   - 普通模式（默认）：单次执行的任务，如提醒、巡检、学习
#   - Loop 模式（LOOP_MODE_ENABLED: "true"）：循环推进的任务，如开发、维护、重构
#     Loop 模式在普通模式基础上增加状态机、目标/里程碑、自动停用等机制。
#
# ⚠️ 为什么需要时间窗口和去重？
# OpenClaw cron 在 gateway 重启或 session 重建时，会补发所有错过的任务。
# 若不设时间窗口，早安/午安/晚安会在开机瞬间同时触发（开机堆叠）。
# 若不去重，同一任务可能在一日内重复执行多次。
# 时间窗口和去重是本模板的核心 Harness 防护机制，不是冗余。
#
# 内置变量：
#   {{WORKSPACE}} - OpenClaw 工作区目录，默认 ~/.openclaw/workspace，由生成器注入

name: "{{JOB_NAME}}"
category: "{{CATEGORY}}"
description: "{{DESCRIPTION}}"

# Agent 任务载荷（与 command 二选一）
# --message：isolated / current / session:<id> 模式下的任务提示文本
# --system-event：main 模式下的系统事件文本
# message 由下方 template 渲染后填充；如未配置 template，则直接使用本字段内容
message: "{{MESSAGE}}"
systemEvent: "{{SYSTEM_EVENT}}"

# 调度配置
# OpenClaw 支持三种计划类型：at（一次性） | every（固定间隔） | cron（定时表达式）
schedule:
  type: "{{SCHEDULE_TYPE}}"     # at | every | cron
  expr: "{{SCHEDULE_EXPR}}"     # cron 表达式 / 相对时间 / 间隔
  timezone: "{{TIMEZONE}}"      # --tz，可选；不带时区时 at 视为 UTC

# 时间窗口保护【非官方】
# OpenClaw 原生不支持时间窗口，本模板在 Prompt 中通过 exec date 自行检查。
# 时区统一使用 schedule.timezone，不在 timeWindow 中重复配置。
timeWindow:
  enabled: "{{TIME_WINDOW_ENABLED}}"
  start: "{{WINDOW_START}}"
  end: "{{WINDOW_END}}"
  action: "{{WINDOW_OUT_ACTION}}"  # NO_REPLY | continue

# 单日/单次去重【非官方】
# OpenClaw 原生不支持去重，本模板在 Prompt 中通过 read/write 文件自行实现。
deduplication:
  enabled: "{{DEDUP_ENABLED}}"
  stateFile: "{{DEDUP_STATE_FILE}}"

# 人设/身份配置【非官方】
# OpenClaw 原生通过 workspace 下的 bootstrap 文件注入人设（SOUL.md / IDENTITY.md 等）。
# 本模板提供一层显式配置，方便场景文件决定使用内联角色还是引用外部人设文件。
persona:
  mode: "{{PERSONA_MODE}}"      # inline | file
  file: "{{PERSONA_FILE}}"      # 外部人设文件路径，如 ~/.openclaw/workspace/SOUL.md 或 IDENTITY.md
  role: "{{PERSONA_ROLE}}"      # inline 模式下的角色描述；file 模式下可留空

# 投递配置
delivery:
  mode: "{{DELIVERY_MODE}}"     # announce | webhook | none
  channel: "{{CHANNEL}}"        # --channel；具体平台如 telegram | slack | discord | whatsapp | mattermost | signal | imessage | ...
                                # 特殊值：last 表示使用最近/当前会话的渠道（非具体平台）
  to: "{{TO}}"                  # --to；接收目标：群聊 ID、私聊 ID 或频道名；部分平台需特殊格式（如 Telegram: -100xxx:topic:123）
  threadId: "{{THREAD_ID}}"       # --thread-id；Telegram forum topic ID
  webhookUrl: "{{WEBHOOK_URL}}" # --webhook；webhook 模式必填
  bestEffort: "{{BEST_EFFORT}}"   # --best-effort-deliver / --no-best-effort-deliver；为 true 时投递失败不会导致整个 cron 作业失败
  failureDestination: "{{FAILURE_DESTINATION}}"  # 【非官方】失败通知投递目标；当前 AGENT 模式无向任意目标投递消息的工具，暂未注入 prompt，预留字段

# 会话配置
session:
  target: "{{SESSION_TARGET}}"  # --session；main | isolated | current | session:<具体ID>
  persistentId: "{{PERSISTENT_ID}}"  # 仅填写 ID 即可，生成器会自动拼成 session:<ID>
  timeoutSeconds: "{{TIMEOUT_SECONDS}}"  # --timeout-seconds

# Agent 执行上下文
context:
  # --light-context：为 true 时跳过 workspace bootstrap 文件注入，节省 Token
  # 说明：
  #   true  = 不加载 AGENTS.md/SOUL.md/IDENTITY.md/USER.md/MEMORY.md（简单提醒/巡检推荐）
  #   false = 完整加载所有系统文件（审查/整理/开发任务必需，需读取系统文件内容）
  lightContext: "{{LIGHT_CONTEXT}}"

# Agent 配置
agent:
  agentId: "{{AGENT_ID}}"       # --agent，绑定特定 agent
  model: "{{MODEL}}"            # --model，模型覆盖，如 claude-sonnet-4-6
  thinking: "{{THINKING}}"      # --thinking，思考级别覆盖，如 off | low | medium | high
  tools: "{{TOOLS}}"            # --tools，限制作业可用工具，如 "exec,read"

# 命令模式（与 message 二选一）
# OpenClaw 原生语义：只要存在 --command 参数即启用命令模式
# 模板层规则：command.script 非空时渲染 --command，否则不渲染
command:
  script: "{{COMMAND_SCRIPT}}"  # --command；非空时启用命令模式
  cwd: "{{COMMAND_CWD}}"        # --command-cwd
  argv: "{{COMMAND_ARGV}}"        # --command-argv
  input: "{{COMMAND_INPUT}}"    # --command-input
  env: "{{COMMAND_ENV}}"          # --command-env
  noOutputTimeoutSeconds: "{{COMMAND_NO_OUTPUT_TIMEOUT}}"  # --no-output-timeout-seconds
  outputMaxBytes: "{{COMMAND_OUTPUT_MAX_BYTES}}"           # --output-max-bytes

# 一次性/实验性选项
advanced:
  disabled: "{{DISABLED}}"        # --disabled，创建后默认禁用
  deleteAfterRun: "{{DELETE_AFTER_RUN}}"  # --delete-after-run，运行成功后自动删除
  keepAfterRun: "{{KEEP_AFTER_RUN}}"      # --keep-after-run，运行成功后保留作业
  wake: "{{WAKE}}"              # --wake；now | next-heartbeat
  exact: "{{EXACT}}"              # --exact，强制精确计时，禁止自动错开
  stagger: "{{STAGGER}}"        # --stagger，显式错开窗口，如 "30s"

# Agent 提示词模板【非官方】
# 用于生成 message 的内容，避免每个场景重复书写通用 Harness/Loop 约束。
# 生成器会用场景变量渲染本模板，结果填入 message 后作为 --message 传递给 OpenClaw。
# 如未配置本模板，则直接使用 message 字段内容。
# ⚠️ 场景文件禁止直接定义顶层 template 字段覆盖本模板，以确保时间窗口、去重等 Harness 机制一致生效。
#    场景特定内容应通过 {{SCENE_SPECIFIC_INSTRUCTIONS}} 占位符，由场景 YAML 的 SCENE_SPECIFIC_INSTRUCTIONS 变量注入。
# {{PERSONA_PROMPT}} 由生成器根据 persona 配置渲染：
# - 若 persona.file 非空：渲染为 "请基于 {{PERSONA_FILE}} 中定义的人设。"
# - 否则（inline 模式）：渲染为 "你是一个{{PERSONA_ROLE}}。"
template: |
  {{PERSONA_PROMPT}}

  {{#NON_LOOP_ONLY}}
  你负责执行本任务。
  {{/NON_LOOP_ONLY}}

  {{#LOOP_ONLY}}
  你负责通过定时任务自动推进软件开发项目。

  **项目信息**
  - 项目名称：{{DEV_PROJECT_NAME}}
  - 项目目录：`{{DEV_PROJECT_DIR}}`
  - 当前阶段：{{DEV_PHASE}}
  - 开发分支：{{DEV_BRANCH}}
  - 总体目标：{{DEV_GOAL}}
  - 里程碑列表：{{DEV_MILESTONES}}
  - 当前里程碑：{{DEV_CURRENT_MILESTONE}}
  - 到达目标后自动停用 cron：{{DEV_AUTO_DISABLE_ON_GOAL_REACHED}}
  {{/LOOP_ONLY}}

  **【防护机制 1：时间窗口】防止开机堆叠时非时段任务误触发【非官方】**
  本机制仅当 `{{TIME_WINDOW_ENABLED}}` 为 true 时生效。若未启用，跳过本检查。
  OpenClaw 在 gateway 重启或 session 重建时会补发错过的任务。
  即使 cron 表达式命中，也必须检查当前时间是否落在有效窗口内。
  执行：用 exec 工具运行 `TZ={{TIMEZONE}} date +%H:%M`，获取当前本地时间。
  将结果解析为 HH:MM 格式：
  - 如果当前时间在 {{WINDOW_START}} 到 {{WINDOW_END}} 之间：继续执行
  - 否则：执行窗口外动作 `{{WINDOW_OUT_ACTION}}`；若该动作为 `NO_REPLY`，立即输出 `NO_REPLY` 并结束运行；若为 `continue`，则继续执行

  **【防护机制 2：单日/单次去重】防止开机堆叠时同一任务重复触发【非官方】**
  本机制仅当 `{{DEDUP_ENABLED}}` 为 true 时生效。若未启用，跳过本检查。
  读取状态文件 {{DEDUP_STATE_FILE}}。
  用 exec 工具运行 `date +%Y-%m-%d`（或 `TZ={{TIMEZONE}} date +%Y-%m-%d`），获取今天日期。
  若文件中已存在该日期，立即输出 `NO_REPLY`，结束运行。

  {{#LOOP_ONLY}}
  ---

  ## PHASE 1：START — 会话启动

  > 先读，再想，后动手。磨刀不误砍柴工。

  ### 步骤 1.1：确保状态文件目录存在

  状态文件路径：`{{DEV_STATE_FILE}}`
  若其父目录不存在，先用 exec 运行 `mkdir -p $(dirname {{DEV_STATE_FILE}})` 创建目录。

  ### 步骤 1.2：读取开发状态

  读取状态文件：`{{DEV_STATE_FILE}}`

  状态文件为 JSON 格式，关键字段：
  - `status`: `ready` | `in_progress` | `blocked` | `goal_reached`
  - `current_card`: 当前进行中的任务卡片标识
  - `last_session`: 上次会话时间（ISO-8601）
  - `next_step`: 下次要做什么（具体、可执行）
  - `blockers`: 阻塞项列表
  - `tech_debt`: 技术债务列表
  - `test_coverage`: 当前测试覆盖情况
  - `dev_log`: 开发日志（每次会话追加）
  - `goal`: 总体目标（与 `{{DEV_GOAL}}` 保持一致）
  - `milestones`: 里程碑列表
  - `current_milestone_index`: 当前里程碑索引（从 0 开始）

  如果状态文件不存在，视为首次开发会话，初始化状态：
  ```json
  {
    "status": "ready",
    "current_card": null,
    "last_session": null,
    "next_step": "认领第一个开发任务",
    "blockers": [],
    "tech_debt": [],
    "test_coverage": "未评估",
    "dev_log": [],
    "goal": "{{DEV_GOAL}}",
    "milestones": {{DEV_MILESTONES}},
    "current_milestone_index": 0
  }
  ```

  写入状态文件前，先执行：
  ```bash
  mkdir -p $(dirname {{DEV_STATE_FILE}})
  ```
  确保父目录存在。

  ### 步骤 1.3：读取项目 TODO

  读取 `{{DEV_PROJECT_DIR}}/TODO.md`（如果存在），了解：
  - 已完成项（标记为 `[x]`）
  - 未完成项（标记为 `[ ]`）
  - 当前优先级最高的任务

  ### 步骤 1.4：读取最近提交历史

  执行：
  ```bash
  cd {{DEV_PROJECT_DIR}} && git log --oneline -5
  ```
  了解代码最新进展。

  ### 步骤 1.5：判断会话类型

  根据 `status` 字段：

  ```
  status = "ready"
    → 新任务：认领最优先的待办项
    → 从 TODO.md 或 Workboard 中找到下一个要完成的任务
    → 更新 current_card 为该任务标识
    → status 改为 "in_progress"

  status = "in_progress"
    → 续传：读取 current_card 和 next_step，继续编码
    → 加载上次中断的上下文

  status = "blocked"
    → 先解阻塞：检查 blocker 内容
    → 限时解决（≤15分钟），超时则记录并跳过
    → 若阻塞解除，status 改为 "in_progress"

  status = "goal_reached"
    → 总体目标已达成
    → 执行 PHASE 3.8：自动停用 cron 任务（如果启用）并发送最终汇报
    → 输出 `NO_REPLY` 并结束运行
  ```

  ### 步骤 1.6：加载开发上下文

  根据当前任务，读取相关代码文件：
  - 当前任务关联的源代码文件
  - 对应的测试文件（`test_*.py` 或对应模式）
  - `requirements.txt` 或依赖配置
  - 架构文档（如 `{{DEV_DOCS_DIR}}/architecture*.md`）

  读取架构文档前，先执行：
  ```bash
  mkdir -p {{DEV_DOCS_DIR}}
  ```
  若目录下不存在架构文档，则跳过读取，不视为错误。

  ---

  ## PHASE 2：DEV — 执行开发任务

  > 专注当前任务，不做无关改动。

  ### 开发纪律（必须遵守）

  1. **最少改动原则**：只碰任务直接相关的代码
  2. **匹配现有风格**：即使自己习惯不同
  3. **清理孤儿代码**：未使用的 import / 变量 / 函数，由我的改动造成的，必须删除
  4. **验证闭环**：
     - 修 bug → 先复现，再修复，再验证
     - 加功能 → 先定义成功标准，完成后再验证
  5. **简单优先**：50 行能搞定的不写 200 行
  6. **阶段边界意识**：当前里程碑完成后，不要自动开启下一个里程碑；留到 EXIT 阶段更新状态

  ### 执行步骤

  {{DEV_TASK_INSTRUCTIONS}}

  ### 测试验证

  开发完成后必须运行测试：
  ```bash
  cd {{DEV_PROJECT_DIR}}
  # 语法检查
  python -m py_compile <修改的文件>
  # 运行相关测试
  python -m pytest {{DEV_TEST_PATTERN}} -v
  ```
  记录测试结果（通过数/总数）。

  ---

  ## PHASE 3：EXIT — 会话退出

  > 保存状态，记录债务，以待来日。代码是临时文件，状态记录才是永恒。

  ### 步骤 3.1：代码收尾

  - [ ] 运行 `python -m py_compile` 检查语法错误
  - [ ] 运行相关测试：`python -m pytest {{DEV_TEST_PATTERN}} -v`
  - [ ] `git diff` — 确认变更范围合理，无意外文件被修改
  - [ ] `git status` — 确认无未提交的重要变更

  ### 步骤 3.2：安全审查

  检查新增/修改文件：
  - [ ] **无 API Key 硬编码** — 搜索 `api_key`, `token`, `password`, `secret`
  - [ ] **无私人路径泄露** — 搜索 `/home/`, `/Users/`, `C:\`, 绝对路径
  - [ ] **无意外删除** — git diff 确认无 rm 操作
  - [ ] **无大型二进制文件** — 确认未提交 >1MB 文件

  ### 步骤 3.3：Git 提交

  ```bash
  cd {{DEV_PROJECT_DIR}}
  git add -A
  git commit -m "{{DEV_COMMIT_PREFIX}}: [{{DEV_PHASE}}] <本次完成的内容摘要> — $(date +%Y-%m-%d) 会话"
  ```

  提交信息中的 `<本次完成的内容摘要>` 由你根据本次实际改动填写，例如：
  - `feat: [P2-T3] Query 扩展与意图分类`
  - `fix: [P2-T1] 修复向量检索空结果异常`
  - `refactor: [P2] 提取公共工具函数`
  - `test: [P2-T3] 补充边界测试`
  - `maint: 2026-06-26 维护会话 — 测试验证`

  > ⚠️ **不执行 `git push`** — 按安全红线，push 前需人工审核

  ### 步骤 3.4：判断里程碑/目标是否完成

  必须同时满足以下**全部**条件，才能认为当前里程碑已完成：
  1. 本次 DEV 阶段产出的核心代码/文件已写入磁盘
  2. 本次修改通过 `python -m py_compile` 语法检查
  3. 相关测试全部通过（或失败项已记录并评估为可接受）
  4. `{{DEV_PROJECT_DIR}}/TODO.md` 中与本里程碑相关的任务已标记为 `[x]`
  5. `git status` 显示无未提交的重要变更（即本次改动已 commit）

  根据以上判定结果更新状态：
  - **当前里程碑未完成**：status 保持 `in_progress`，next_step 设为本次未完的具体下一步
  - **当前里程碑已完成，且还有下一个里程碑**：
    - `current_milestone_index` + 1
    - `status` 改为 `ready`
    - `current_card` 设为下一个里程碑的首个任务
    - `next_step` 设为"开始下一个里程碑：xxx"
  - **当前里程碑已完成，且已是最后一个里程碑**：
    - `status` 改为 `goal_reached`
    - `current_card` 设为 null 或"目标已达成"
    - `next_step` 设为"目标已达成，等待用户介入运维"

  ### 步骤 3.5：更新状态文件

  更新 `{{DEV_STATE_FILE}}`：
  - `last_session` → 当前时间（ISO-8601，用 exec 获取）
  - `current_card` → 本次完成/进行中的卡片
  - `status` → 根据 3.4 判断的结果
  - `next_step` → 下次要做什么（具体、可执行）
  - `blockers` → 本次遇到的未解决阻塞
  - `tech_debt` → 本次产生的技术债务
  - `test_coverage` → 当前测试覆盖情况
  - `dev_log` → 追加本次会话记录（包含时间、任务、摘要、测试结果、commit hash）
  - `goal` / `milestones` / `current_milestone_index` → 同步更新

  写入前确保父目录已存在。

  ### 步骤 3.6：更新 TODO.md

  更新 `{{DEV_PROJECT_DIR}}/TODO.md`：
  - 标记已完成的项为 `[x]`
  - 新增发现的待办项
  - 更新「进行中」和「下次计划」

  ### 步骤 3.7：汇报（如配置了投递）

  如果 `{{DELIVERY_MODE}}` 为 `announce`，发送汇报消息。汇报内容必须从状态文件中读取最新值后填入：

  ```
  🗡️ 【{{DEV_PROJECT_NAME}}】开发迭代汇报

  时间：<用 exec 获取当前日期和时间>
  当前里程碑：<状态文件中的 current_milestone_index 对应里程碑>
  任务：<状态文件中的 current_card>
  状态：<状态文件中的 status>

  完成项：
  - <根据 dev_log 最后一条填写>

  测试：<状态文件中的 test_coverage>

  债务：<状态文件中的 tech_debt>

  下次：<状态文件中的 next_step>
  ```

  如果 status 为 `goal_reached`，汇报标题改为 `🎯 【{{DEV_PROJECT_NAME}}】目标已达成`，并说明等待用户介入运维。

  ### 步骤 3.8：到达目标后自动停用 cron 任务（可选）

  如果同时满足：
  1. 状态文件中 `status` 为 `goal_reached`
  2. `{{DEV_AUTO_DISABLE_ON_GOAL_REACHED}}` 为 `true`

  则按以下顺序尝试禁用本 cron 任务：

  **方式 1：通过状态文件中记录的 cron_job_id 禁用（推荐，最可靠）**
  读取状态文件，若存在 `cron_job_id` 字段，直接执行：
  ```bash
  openclaw cron edit <cron_job_id> --disabled
  ```

  **方式 2：通过任务名称查找并禁用**
  若状态文件中无 `cron_job_id`，用 exec 运行：
  ```bash
  openclaw cron list --format json
  ```
  在 JSON 输出中精确匹配 `name` 等于 `{{JOB_NAME}}` 的任务，提取其 `id`，然后执行：
  ```bash
  openclaw cron edit <任务ID> --disabled
  ```

  **失败处理**：
  - 若方式 1 和方式 2 均失败，在汇报中追加："⚠️ 自动停用失败，请手动运行 `openclaw cron edit <任务ID> --disabled`"
  - 将失败原因记录到状态文件的 `dev_log` 中，由用户手动处理。

  若成功禁用，在汇报中追加："本任务已自动停用，等待用户介入。"

