# 通用 OpenClaw Cron 任务模板
# 本文件包含 OpenClaw 官方 CLI 参数映射、以及模板层 Harness/Loop 扩展。
# 标注为【非官方】的字段不是 OpenClaw 原生参数，由本模板用 Prompt 工具调用实现。
# 场景文件（如 reminders/morning.yaml）只需提供 variables；未提供的变量由生成器使用默认值填充。
#
# 本模板同时支持两种执行模式：
#   - 普通模式（默认）：单次执行的任务，如提醒、巡检、学习
#   - Loop 模式（LOOP_MODE_ENABLED: "true"）：循环推进的任务，如开发、维护、重构
#     Loop 模式在普通模式基础上增加状态机、目标/里程碑、自动停用等机制。
#
# ⚠️ 关于时间窗口、去重与 trigger 的关系
# OpenClaw cron 在 gateway 重启或 session 重建时，会补发所有错过的任务。
# 若 cron 调度到达时 trigger 返回 fire: false，则任务被跳过，不会造成开机堆叠。
# 时间窗口和去重统一由 OpenClaw/skills/aac-cron-manage/scripts/trigger.js 处理，所有 cron 任务共用同一份基础逻辑。
# ⚠️ 场景专属 .js 暂不可用：OpenClaw trigger 沙箱禁止 child_process / fs 模块。
# build-cron.py 保留场景 JS 拼接脚手架，待沙箱策略优化后启用。
#
# 内置变量：
#   {{WORKSPACE}} - OpenClaw 工作区目录，默认 ~/.openclaw/workspace，由生成器注入

# ===== 基础信息 =====
# --name：任务名称，强制格式为 【AAC-分类】任务名
#   分类取值：提醒 | 巡检 | 项目 | 学习
#   示例：【AAC-巡检】Docker 容器健康
name: "{{JOB_NAME}}"
# 内部分类标签（提醒/巡检/项目/学习），非 OpenClaw CLI 参数，仅用于文档与 skill 路由
category: "{{CATEGORY}}"
# --description：任务用途的简短描述，便于在 cron list 中快速识别
#   示例：检查 Docker 容器运行状态，异常时告警
description: "{{DESCRIPTION}}"
# --display-name：人类可读的声明式标签，用于 UI 展示（可选，留空则使用 name）
#   与 name 的区别：name 用于机器匹配（带 【AAC-】 前缀），displayName 用于人类阅读
#   示例：Docker 巡检
displayName: "{{DISPLAY_NAME}}"
# --declaration-key：幂等声明键，同一 key 的 create 操作不会重复创建
#   场景 YAML 中建议填写固定值，防止 skill 误操作创建重复任务
#   留空则不启用幂等保护
declarationKey: "{{DECLARATION_KEY}}"

# ===== 任务载荷（Agent 模式与命令模式二选一）=====
# --message：isolated / current / session:<id> 模式下的 Agent 提示文本
# --system-event：main 模式下的系统事件文本
# message 由下方 template 渲染后填充；如未配置 template，则直接使用本字段内容
message: "{{MESSAGE}}"
systemEvent: "{{SYSTEM_EVENT}}"

# ===== 调度配置 =====
# OpenClaw 支持三种计划类型。
schedule:
  # 计划类型：cron（定时表达式）| at（一次性）| every（固定间隔）
  type: "{{SCHEDULE_TYPE}}"
  # 计划表达式：
  #   cron 类型：5 字段 cron 表达式，如 "0 8 * * *"（每天 8:00）
  #   at 类型：ISO-8601 时间戳或相对时间，如 "+1h"
  #   every 类型：间隔，如 "10m"、"1h"
  expr: "{{SCHEDULE_EXPR}}"
  # --tz：IANA 时区。为空时使用 Gateway 宿主机本地时区
  #   示例：Asia/Shanghai | America/New_York | Europe/London
  timezone: "{{TIMEZONE}}"

# ===== 时间窗口（Trigger 环境变量）=====
# 供 trigger.js 使用，由 build-cron.py 注入为环境变量。
# 窗口外触发的任务会被 trigger 拦截（fire: false），防止 Gateway 重启后开机堆叠。
timeWindow:
  # 窗口开始时间，格式 HH:MM，如 "07:00"
  start: "{{WINDOW_START}}"
  # 窗口结束时间，格式 HH:MM，如 "23:59"
  end: "{{WINDOW_END}}"

# ===== 去重（Trigger 环境变量）=====
# 供 trigger.js 使用，由 build-cron.py 注入为环境变量。
# 防止同一任务在短时间内被重复执行。
deduplication:
  # 去重状态文件路径，如 {{WORKSPACE}}/.state/reminder-morning.txt
  stateFile: "{{DEDUP_STATE_FILE}}"
  # 去重粒度：daily（每天一次）| half-day（每半天）| hourly（每小时）| per-run（不去重）
  granularity: "{{DEDUP_GRANULARITY}}"

# ===== 人设/身份（非官方扩展）=====
# OpenClaw 原生通过 workspace bootstrap 文件注入人设（SOUL.md / IDENTITY.md）。
# 本模板提供显式配置层，方便场景文件选择内联角色还是引用外部人设文件。
persona:
  # 注入方式：inline（内联角色描述）| file（引用外部人设文件）
  mode: "{{PERSONA_MODE}}"
  # file 模式下的外部人设文件路径，如 {{WORKSPACE}}/SOUL.md
  file: "{{PERSONA_FILE}}"
  # inline 模式下的角色描述，如 "贴心的智能助手"；file 模式下可留空
  role: "{{PERSONA_ROLE}}"

# ===== 投递配置 =====
# 控制任务执行结果/汇报投递到哪个渠道。巡检类可设为 none（正常静默），提醒类设为 announce（强制送达）。
delivery:
  # --announce / --webhook / --no-deliver
  #   announce：Agent 没发则 Runner 兜底发，适合必须送达的提醒
  #   webhook：POST 到 webhookUrl，适合集成外部系统
  #   none：无 Runner 兜底，适合巡检类（正常时静默，异常由 Agent 自行投递）
  mode: "{{DELIVERY_MODE}}"
  # --channel：投递渠道。填写平台标识：telegram | slack | discord | whatsapp | feishu | ...
  #   特殊值 "last" 表示复用最近会话的渠道。
  #   ⚠️ isolated 会话（默认）没有最近渠道上下文：announce + "last" 必然投递失败，
  #   build-cron.py 构建期会直接报错拦截。isolated 场景必须填显式平台 + TO。
  channel: "{{CHANNEL}}"
  # --to：接收目标。格式因平台而异：
  #   Telegram: -100xxx（群聊）或数字 ID（私聊），支持 topic:123 后缀
  #   Discord: channelId 或 user:ID
  #   Feishu: chat_id 或 open_id
  to: "{{TO}}"
  # --thread-id：Telegram 论坛话题 ID，仅 Telegram 平台有效
  threadId: "{{THREAD_ID}}"
  # --webhook：webhook 接收 URL，仅 delivery.mode = webhook 时生效
  webhookUrl: "{{WEBHOOK_URL}}"
  # --best-effort-deliver / --no-best-effort-deliver
  #   true：投递失败不导致 cron 作业标记为失败（提醒类推荐）
  #   false：投递失败则作业也标记失败
  bestEffort: "{{BEST_EFFORT}}"
  # --account：多渠道账号选择。当同一平台配置了多个账号时，指定使用哪个
  #   留空则使用默认账号
  account: "{{ACCOUNT}}"
  # 【非官方】失败通知的备用投递目标。当前 Agent 模式下暂未注入 prompt，预留字段。
  failureDestination: "{{FAILURE_DESTINATION}}"

# ===== 会话配置 =====
# 控制 cron 任务在哪个会话中执行。绝大多数任务推荐 isolated（独立会话，不污染主会话）。
session:
  # --session：执行会话目标
  #   main：主会话，适合需要立即打扰用户的提醒
  #   isolated：独立会话，不污染主会话（推荐）
  #   current：绑定当前创建时的会话
  #   session:<id>：持久命名会话，适合需要历史积累的 Loop 任务
  target: "{{SESSION_TARGET}}"
  # 持久会话 ID（仅填写 ID 即可，生成器自动拼成 session:<ID> 传给 --session）
  # 当 SESSION_TARGET 不以 session: 开头时，若 PERSISTENT_ID 非空则自动拼接
  persistentId: "{{PERSISTENT_ID}}"
  # --timeout-seconds：Agent/命令任务的超时秒数
  #   提醒类: 120s | 巡检类: 300s | 开发类: 14400s (4h) | 学习类: 3600s (1h)
  timeoutSeconds: "{{TIMEOUT_SECONDS}}"
  # --timeout：毫秒级超时（可选）。若同时设置 timeoutSeconds 和 timeoutMs，
  #   OpenClaw 以更严格的为准。大多数场景用 timeoutSeconds 即可，
  #   需要亚秒级精度控制时使用 timeoutMs
  timeoutMs: "{{TIMEOUT_MS}}"

# ===== 执行上下文 =====
context:
  # --light-context：是否跳过 workspace bootstrap 文件注入
  #   true：不加载 AGENTS.md/SOUL.md/IDENTITY.md 等，省 Token（提醒/巡检推荐）
  #   false：完整加载所有系统文件（开发/整理/学习必需）
  lightContext: "{{LIGHT_CONTEXT}}"

# ===== Agent 配置 =====
# 控制执行任务的 Agent 身份、模型与能力。留空则使用 Gateway 默认值。
agent:
  # --agent：绑定特定 Agent ID，不填则使用默认 Agent
  agentId: "{{AGENT_ID}}"
  # --model：模型覆盖。格式为 provider/model 或别名
  #   示例：kimi-for-coding/kimi-for-coding | datagrand/deepseek-v4-pro
  model: "{{MODEL}}"
  # --fallbacks：模型降级链。当主模型不可用时，按顺序尝试 fallback 模型
  #   格式：逗号分隔的模型列表，如 "datagrand/deepseek-v4-pro,openai/gpt-4o"
  #   留空则不启用降级
  fallbacks: "{{FALLBACKS}}"
  # --thinking：思考级别。控制推理深度与 Token 消耗
  #   off：关闭思考（提醒/问候类推荐）| low：简单巡检 | medium：开发/学习 | high：复杂分析
  thinking: "{{THINKING}}"
  # --tools：工具白名单，限制 Agent 可用的工具
  #   逗号分隔，如 "exec,read,write"。留空则可用全部工具
  tools: "{{TOOLS}}"

# ===== 命令模式（与 Agent 模式二选一）=====
# 当 command.script 非空时启用命令模式，否则使用 Agent 模式。
# 命令模式适合纯脚本巡检、数据导出等不需要 Agent 推理的确定性任务。
command:
  # --command：要执行的 shell 命令
  script: "{{COMMAND_SCRIPT}}"
  # --command-cwd：命令的工作目录
  cwd: "{{COMMAND_CWD}}"
  # --command-argv：精确参数数组（JSON），避免 shell 转义问题
  #   示例：["node", "scripts/export.mjs", "--format=json"]
  argv: "{{COMMAND_ARGV}}"
  # --command-input：标准输入内容
  input: "{{COMMAND_INPUT}}"
  # --command-env：环境变量覆盖，格式 KEY=VALUE（可重复）
  env: "{{COMMAND_ENV}}"
  # --no-output-timeout-seconds：无输出超时秒数，超时则杀进程
  noOutputTimeoutSeconds: "{{COMMAND_NO_OUTPUT_TIMEOUT}}"
  # --output-max-bytes：stdout/stderr 捕获上限（字节）
  outputMaxBytes: "{{COMMAND_OUTPUT_MAX_BYTES}}"

# ===== Trigger 配置（OpenClaw 2026.7.1+ 官方特性）=====
# schedule 到达后先执行 trigger 脚本，返回 { fire: true } 时才执行 payload。
# 脚本由 OpenClaw/skills/aac-cron-manage/scripts/trigger.js 统一提供（时间窗口检查），
# build-cron.py 自动组装并注入环境变量。
# 若 TRIGGER_ENABLED 为 true，Prompt 层省略时间窗口和去重逻辑。
#
# ⚠️ 场景专属 .js 暂不可用：OpenClaw trigger 沙箱禁止 child_process / fs 模块，
#    当前仅通用时间窗口检查可正常工作。build-cron.py 保留场景 JS 拼接脚手架，
#    待 OpenClaw 优化沙箱策略后启用。
trigger:
  # 是否启用 trigger 机制（true/false）
  enabled: "{{TRIGGER_ENABLED}}"
  # trigger 脚本内容（由 build-cron.py 自动填充，场景 YAML 无需设置）
  script: "{{TRIGGER_SCRIPT}}"
  # --trigger-once：首次成功触发后自动失效（true/false）
  once: "{{TRIGGER_ONCE}}"

# ===== 高级选项 =====
# 控制任务生命周期、执行精度与钩子。
advanced:
  # --disabled：创建后默认禁用，需手动启用（调试/预发布场景）
  disabled: "{{DISABLED}}"
  # --delete-after-run：成功执行后自动删除（一次性任务）
  deleteAfterRun: "{{DELETE_AFTER_RUN}}"
  # --keep-after-run：成功执行后保留任务（默认行为）
  keepAfterRun: "{{KEEP_AFTER_RUN}}"
  # --wake：创建后立即唤醒还是等下次心跳
  #   now：立即执行 | next-heartbeat：等下次心跳
  wake: "{{WAKE}}"
  # --exact：禁用 cron 自动错峰（stagger），精确按 cron 表达式触发
  #   true：准时触发（提醒类推荐）| false：允许 Gateway 自动错峰
  exact: "{{EXACT}}"
  # --stagger：显式错峰窗口，如 "30s"、"5m"
  #   与 exact 互斥：exact=true 时 stagger 无效
  stagger: "{{STAGGER}}"
  # --expect-final：等待 Agent 最终回复后才标记任务完成
  #   true：适合需要保证输出质量的开发/学习类任务
  #   false：Agent 启动即标记完成（默认，适合提醒/巡检类）
  expectFinal: "{{EXPECT_FINAL}}"
  # --on-exit：监听进程退出事件。填写要监控的命令（如 "docker compose up"），
  #   该命令退出时触发一次性回调。与普通 cron 互斥，仅高级场景使用
  #   留空则不启用
  onExit: "{{ON_EXIT}}"
  # --on-exit-cwd：on-exit 监听命令的工作目录
  onExitCwd: "{{ON_EXIT_CWD}}"

# Agent 提示词模板【非官方】
# 用于生成 message 的内容，避免每个场景重复书写通用 Harness/Loop 约束。
# 生成器会用场景变量渲染本模板，结果填入 message 后作为 --message 传递给 OpenClaw。
# 如未配置本模板，则直接使用 message 字段内容。
# ⚠️ 场景文件禁止直接定义顶层 template 字段覆盖本模板，以确保 Loop 状态机、Harness 等机制一致生效。
#    场景特定内容应通过 {{SCENE_SPECIFIC_INSTRUCTIONS}} 占位符，由场景 YAML 的 SCENE_SPECIFIC_INSTRUCTIONS 变量注入。
# {{PERSONA_PROMPT}} 由生成器根据 persona 配置渲染：
# - 若 persona.file 非空：渲染为 "请基于 {{PERSONA_FILE}} 中定义的人设。"
# - 否则（inline 模式）：渲染为 "你是一个{{PERSONA_ROLE}}。"
template: |
  {{PERSONA_PROMPT}}

  {{#NON_LOOP_ONLY}}
  你负责执行本任务。
  {{/NON_LOOP_ONLY}}

  {{#LOOP_ONLY}}
  你负责通过定时任务自动推进 {{LOOP_TASK_TYPE}} 任务。

  **任务信息**
  - 任务名称：{{DEV_PROJECT_NAME}}
  - 工作目录：`{{DEV_PROJECT_DIR}}`
  - 当前阶段：{{DEV_PHASE}}
  - 工作分支：{{DEV_BRANCH}}
  - 总体目标：{{DEV_GOAL}}
  - 里程碑列表：{{DEV_MILESTONES}}
  - 当前里程碑：{{DEV_CURRENT_MILESTONE}}
  - 到达目标后自动停用 cron：{{DEV_AUTO_DISABLE_ON_GOAL_REACHED}}
  {{/LOOP_ONLY}}

  {{#LOOP_ONLY}}
  ---

  ## PHASE 1：START — 会话启动

  > 先读，再想，后动手。磨刀不误砍柴工。

  ### 步骤 1.1：确保状态文件目录存在

  状态文件路径：`{{DEV_STATE_FILE}}`
  ⚠️ **警告**：每个 Loop 任务必须使用独立的状态文件。若多个任务共用同一个 `DEV_STATE_FILE`，会导致状态互相覆盖、里程碑错乱甚至目标提前达成。请在场景 YAML 中为每个任务配置不同的状态文件路径（例如 `dev-session.json` 与 `maintain-session.json`）。
  若其父目录不存在，先用 exec 运行 `mkdir -p $(dirname {{DEV_STATE_FILE}})` 创建目录。

  ### 步骤 1.2：读取状态

  读取状态文件：`{{DEV_STATE_FILE}}`

  状态文件为 JSON 格式，**核心字段**（所有 Loop 任务通用）：
  - `status`: `ready` | `in_progress` | `blocked` | `goal_reached`
  - `current_card`: 当前进行中的任务标识
  - `last_session`: 上次会话时间（ISO-8601）
  - `next_step`: 下次要做什么（具体、可执行）
  - `blockers`: 阻塞项列表
  - `dev_log`: 执行日志（每次会话追加）
  - `goal`: 总体目标（与 `{{DEV_GOAL}}` 保持一致）
  - `milestones`: 里程碑列表
  - `current_milestone_index`: 当前里程碑索引（从 0 开始）

  **默认扩展字段**（软件开发场景，`tech_debt` 记录技术债务，`test_coverage` 记录测试覆盖）：
  - `tech_debt`: []
  - `test_coverage`: "未评估"

  **自定义扩展字段**：如果 `{{LOOP_STATE_SCHEMA}}` 非空，解析其中的字段定义，在初始化或更新状态文件时一并维护。

  如果状态文件不存在，视为首次会话，初始化状态：
  ```json
  {
    "status": "ready",
    "current_card": null,
    "last_session": null,
    "next_step": "认领第一个任务",
    "blockers": [],
    "tech_debt": [],
    "test_coverage": "未评估",
    "dev_log": [],
    "goal": "{{DEV_GOAL}}",
    "milestones": {{DEV_MILESTONES}},
    "current_milestone_index": 0
  }
  ```

  如果 `{{LOOP_STATE_SCHEMA}}` 非空，将其中定义的字段 merge 到以上 JSON 中再写入。
  写入状态文件前，先执行：
  ```bash
  mkdir -p $(dirname {{DEV_STATE_FILE}})
  ```
  确保父目录存在。

  ### 步骤 1.3：判断会话类型（状态机核心）

  根据 `status` 字段：

  ```
  status = "ready"
    → 新任务：认领最优先的待办项
    → 更新 current_card 为该任务标识
    → status 改为 "in_progress"

  status = "in_progress"
    → 续传：读取 current_card 和 next_step，继续执行
    → 加载上次中断的上下文

  status = "blocked"
    → 先解阻塞：检查 blocker 内容
    → 限时解决（≤15分钟），超时则记录并跳过
    → 若阻塞解除，status 改为 "in_progress"

  status = "goal_reached"
    → 总体目标已达成
    → 执行 PHASE 3 的自动停用步骤并发送最终汇报
    → 输出 `NO_REPLY` 并结束运行
  ```

  ---

  ## PHASE 2：EXEC — 执行任务

  > 以下为业务执行阶段。通过变量 LOOP_EXEC_INSTRUCTIONS 可自定义本阶段全部内容。

  {{#IF LOOP_EXEC_INSTRUCTIONS}}
  {{LOOP_EXEC_INSTRUCTIONS}}
  {{#ELSE}}
  ### 步骤 2.1：读取项目 TODO

  读取 `{{DEV_PROJECT_DIR}}/TODO.md`（如果存在），了解：
  - 已完成项（标记为 `[x]`）
  - 未完成项（标记为 `[ ]`）
  - 当前优先级最高的任务

  ### 步骤 2.2：读取最近提交历史

  执行：
  ```bash
  cd {{DEV_PROJECT_DIR}} && git log --oneline -5
  ```
  了解代码最新进展。

  ### 步骤 2.3：加载开发上下文

  根据当前任务，读取相关代码文件：
  - 当前任务关联的源代码文件
  - 对应的测试文件（`test_*.py` 或对应模式）
  - `requirements.txt` 或依赖配置
  - 架构文档（如 `{{DEV_DOCS_DIR}}/architecture*.md`）

  读取架构文档前，先执行：
  ```bash
  mkdir -p {{DEV_DOCS_DIR}}
  ```
  若目录下不存在架构文档，则跳过读取，不视为错误。

  ---

  ### 开发纪律（必须遵守）

  1. **最少改动原则**：只碰任务直接相关的代码
  2. **匹配现有风格**：即使自己习惯不同
  3. **清理孤儿代码**：未使用的 import / 变量 / 函数，由我的改动造成的，必须删除
  4. **验证闭环**：
     - 修 bug → 先复现，再修复，再验证
     - 加功能 → 先定义成功标准，完成后再验证
  5. **简单优先**：50 行能搞定的不写 200 行
  6. **阶段边界意识**：当前里程碑完成后，不要自动开启下一个里程碑；留到 EXIT 阶段更新状态

  ### 执行步骤

  {{DEV_TASK_INSTRUCTIONS}}

  ### 测试验证

  开发完成后必须运行测试：
  ```bash
  cd {{DEV_PROJECT_DIR}}
  # 语法检查
  python -m py_compile <修改的文件>
  # 运行相关测试
  python -m pytest {{DEV_TEST_PATTERN}} -v
  ```
  记录测试结果（通过数/总数）。

  ---

  ### 代码收尾

  - [ ] 运行 `python -m py_compile` 检查语法错误
  - [ ] 运行相关测试：`python -m pytest {{DEV_TEST_PATTERN}} -v`
  - [ ] `git diff` — 确认变更范围合理，无意外文件被修改
  - [ ] `git status` — 确认无未提交的重要变更

  ### 安全审查

  检查新增/修改文件：
  - [ ] **无 API Key 硬编码** — 搜索 `api_key`, `token`, `password`, `secret`
  - [ ] **无私人路径泄露** — 搜索 `/home/`, `/Users/`, `C:\`, 绝对路径
  - [ ] **无意外删除** — git diff 确认无 rm 操作
  - [ ] **无大型二进制文件** — 确认未提交 >1MB 文件

  ### Git 提交

  ```bash
  cd {{DEV_PROJECT_DIR}}
  git add -A
  git commit -m "{{DEV_COMMIT_PREFIX}}: [{{DEV_PHASE}}] <本次完成的内容摘要> — $(date +%Y-%m-%d) 会话"
  ```

  提交信息中的 `<本次完成的内容摘要>` 由你根据本次实际改动填写，例如：
  - `feat: [P2-T3] Query 扩展与意图分类`
  - `fix: [P2-T1] 修复向量检索空结果异常`
  - `refactor: [P2] 提取公共工具函数`
  - `test: [P2-T3] 补充边界测试`
  - `maint: 2026-06-26 维护会话 — 测试验证`

  > ⚠️ **不执行 `git push`** — 按安全红线，push 前需人工审核

