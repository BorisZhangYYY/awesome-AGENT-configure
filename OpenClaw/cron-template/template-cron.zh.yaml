  ## PHASE 3：EXIT — 会话退出

  > 保存状态，记录日志，以待来日。状态记录才是永恒。

  ### 步骤 3.1：判断里程碑/目标是否完成

  根据 PHASE 2 的执行结果和 {{DEV_GOAL}} 各里程碑的完成标准，判定当前里程碑的完成状态。

  {{#IF LOOP_EXEC_INSTRUCTIONS}}
  （根据你在 PHASE 2 中定义的任务完成标准自行判定）
  {{#ELSE}}
  软件开发场景的判定条件（需同时满足**全部**）：
  1. 本次产出的核心代码/文件已写入磁盘
  2. 本次修改通过 `python -m py_compile` 语法检查
  3. 相关测试全部通过（或失败项已记录并评估为可接受）
  4. `{{DEV_PROJECT_DIR}}/TODO.md` 中与本里程碑相关的任务已标记为 `[x]`
  5. `git status` 显示无未提交的重要变更（即本次改动已 commit）
  {{/IF}}

  根据以上判定结果更新状态：
  - **当前里程碑未完成**：status 保持 `in_progress`，next_step 设为本次未完的具体下一步
  - **当前里程碑已完成，且还有下一个里程碑**：
    - `current_milestone_index` + 1
    - `status` 改为 `ready`
    - `current_card` 设为下一个里程碑的首个任务
    - `next_step` 设为"开始下一个里程碑：xxx"
  - **当前里程碑已完成，且已是最后一个里程碑**：
    - `status` 改为 `goal_reached`
    - `current_card` 设为 null 或"目标已达成"
    - `next_step` 设为"目标已达成，等待用户介入运维"

  ### 步骤 3.2：更新状态文件

  更新 `{{DEV_STATE_FILE}}`：
  - `last_session` → 当前时间（ISO-8601，用 exec 获取）
  - `current_card` → 本次完成/进行中的卡片
  - `status` → 根据 3.1 判断的结果
  - `next_step` → 下次要做什么（具体、可执行）
  - `blockers` → 本次遇到的未解决阻塞
  - `dev_log` → 追加本次会话记录（包含时间、任务、摘要、结果）
  - `goal` / `milestones` / `current_milestone_index` → 同步更新
  {{#IF LOOP_EXEC_INSTRUCTIONS}}
  - 自定义字段：根据 {{LOOP_STATE_SCHEMA}} 中定义的字段同步更新
  {{#ELSE}}
  - `tech_debt` → 本次产生的技术债务
  - `test_coverage` → 当前测试覆盖情况
  {{/IF}}

  写入前确保父目录已存在。

  ### 步骤 3.3：汇报（如配置了投递）

  如果 `{{DELIVERY_MODE}}` 为 `announce`，发送汇报消息。汇报内容必须从状态文件中读取最新值后填入：

  ```
  汇报标题：【{{DEV_PROJECT_NAME}}】任务执行汇报

  时间：<用 exec 获取当前日期和时间>
  当前里程碑：<状态文件中的 current_milestone_index 对应里程碑>
  任务：<状态文件中的 current_card>
  状态：<状态文件中的 status>

  完成项：
  - <根据 dev_log 最后一条填写>

  下次：<状态文件中的 next_step>
  ```

  如果 status 为 `goal_reached`，汇报标题改为 `🎯 【{{DEV_PROJECT_NAME}}】目标已达成`，并说明等待用户介入运维。

  ### 步骤 3.4：到达目标后自动停用 cron 任务（可选）

  如果同时满足：
  1. 状态文件中 `status` 为 `goal_reached`
  2. `{{DEV_AUTO_DISABLE_ON_GOAL_REACHED}}` 为 `true`

  则按以下顺序尝试禁用本 cron 任务：

  **方式 1：通过状态文件中记录的 cron_job_id 禁用（推荐，最可靠）**
  读取状态文件，若存在 `cron_job_id` 字段，直接执行：
  ```bash
  openclaw cron edit <cron_job_id> --disabled
  ```

  **方式 2：通过任务名称查找并禁用**
  若状态文件中无 `cron_job_id`，用 exec 运行：
  ```bash
  openclaw cron list --format json
  ```
  在 JSON 输出中精确匹配 `name` 等于 `{{JOB_NAME}}` 的任务，提取其 `id`，然后执行：
  ```bash
  openclaw cron edit <任务ID> --disabled
  ```

  **失败处理**：
  - 若方式 1 和方式 2 均失败，在汇报中追加："⚠️ 自动停用失败，请手动运行 `openclaw cron edit <任务ID> --disabled`"
  - 将失败原因记录到状态文件的 `dev_log` 中，由用户手动处理。

  若成功禁用，在汇报中追加："本任务已自动停用，等待用户介入。"

