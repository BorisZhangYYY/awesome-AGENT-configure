# 自定义提醒场景（复制此文件后按需修改）
# 本文件为示例配置，更多字段可参考 ../template-cron.zh.yaml 按需覆盖。
templateRef: "../../template-cron.zh.yaml"

variables:
  # ========== 自定义占位符（复制后按需修改）==========
  CUSTOM_SCENE_NAME: "自定义提醒"
  CUSTOM_SCENE_KEY: "custom"
  CUSTOM_DESCRIPTION: "自定义提醒场景"
  CUSTOM_SCHEDULE_EXPR: "0 9 * * *"
  CUSTOM_WINDOW_START: "08:00"
  CUSTOM_WINDOW_END: "22:00"
  CUSTOM_EMOJI: "📝"
  CUSTOM_PERSONA_ROLE: "贴心的智能助手"
  CUSTOM_TONE: "温和、自然"
  CUSTOM_REMARK: "这是自定义提醒内容"

  JOB_NAME: "【AAC-提醒】{{CUSTOM_SCENE_NAME}}"
  DESCRIPTION: "{{CUSTOM_DESCRIPTION}}"

  SCHEDULE_EXPR: "{{CUSTOM_SCHEDULE_EXPR}}"
  WINDOW_START: "{{CUSTOM_WINDOW_START}}"
  WINDOW_END: "{{CUSTOM_WINDOW_END}}"
  DEDUP_STATE_FILE: "{{WORKSPACE}}/.state/reminder-{{CUSTOM_SCENE_KEY}}.txt"

  # Trigger：使用内置 time_window.js 脚本库，在 Prompt 外完成时间窗口和去重检查
  TRIGGER_ENABLED: "true"

  # 提醒类任务关闭思考，节省 Token
  THINKING: "off"
  # 提醒类任务需要准时触发，禁用自动 stagger
  EXACT: "true"

  SCENE_NAME: "{{CUSTOM_SCENE_NAME}}"
  EMOJI: "{{CUSTOM_EMOJI}}"
  PERSONA_ROLE: "{{CUSTOM_PERSONA_ROLE}}"
  TONE: "{{CUSTOM_TONE}}"
  REMARK: "{{CUSTOM_REMARK}}"  # 提醒消息中可附带的额外内容

  SCENE_SPECIFIC_INSTRUCTIONS: |
    你负责在合适的时间给主人送上{{SCENE_NAME}}提醒。

    **问候规则**
    - 语气：{{TONE}}
    - 长度：2-3 句话，不要长篇大论
    - 必须包含：当前时间、今天日期、星期几
    - 可附带：{{REMARK}}

    **输出示例**
    ```
    {{EMOJI}} {{SCENE_NAME}}！
    现在是 <用 exec 运行 `date +%H:%M` 获取的当前时间>，<用 exec 运行 `date +%Y-%m-%d` 获取的当前日期> <用 exec 运行 `LC_TIME=zh_CN date +%A` 获取的星期几>。
    {{REMARK}}
    ```

  # 可按需覆盖默认值，例如：
  # DELIVERY_MODE: "announce"
  # CHANNEL: "telegram"
  # TO: "-1001234567890"
