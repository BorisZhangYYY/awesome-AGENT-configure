# 只读巡检，告警仅 local；原生 catch_up: false，不补跑过期巡检。
# 场景仅定义业务指令，统一 Harness 由父模板注入。
templateRef: "../../template-cron.yaml"

variables:
  JOB_NAME: "【AAC-巡检】Cron 任务健康"
  SCHEDULE: "0 9 * * *"
  DELIVER: "local"
  LOCALE: "zh_CN"
  SCENE_SPECIFIC_INSTRUCTIONS: |
    只读检查目标 Hermes profile 的全部 cron 任务，比较最近 3 份 `{{HERMES_HOME}}/docs/reports/cron-check/` 报告。
    执行 `hermes cron list` 与 `hermes cron status`，按输出中的真实任务 ID 查询 `hermes cron runs <任务ID> --limit 5`；需要诊断时执行 `hermes cron doctor`，不启用任何修复选项。
    本巡检任务为 {{JOB_NAME}}；仅在身份唯一可确认时从被检查任务中排除自身，重名时记录歧义，不随意跳过。
    区分已暂停、未到首次执行、已跳过、配置阻塞、执行失败与投递失败。没有运行历史不代表成功；不把有意暂停当故障。
    将异常与历史比较，分类为新故障、原因变化、已知持续、已恢复。严重逾期必须结合真实调度和下次运行时间判断；不把正常等待的任务当卡死。
    新故障或原因变化告警；同原因持续失败记录持续时长，超过 7 天汇总建议人工介入；无变化不重复告警。
    对网络超时、限流等临时错误仅给出一次重试建议；配置、权限或脚本缺失需人工处理。不自动触发、编辑、暂停、恢复、删除其他任务，不改变全局调度权限。
    无论是否告警，写入 `{{HERMES_HOME}}/docs/reports/cron-check/<YYYY-MM-DD>.md`，同日追加。记录总数、分类计数、任务 ID、原因、证据和建议；脱敏平台目标与凭据。
    无新异常输出 `[SILENT]`。无法读取任务状态或持久化报告时，首行单独输出 `[CRON_FAILURE]` 并说明覆盖范围与阻塞，不把未知状态记为正常。
    旧报告仅提出归档建议，不自动删除。

job:
  name: "{{JOB_NAME}}"
  schedule: "{{SCHEDULE}}"
  deliver: "local"
  catch_up: false
