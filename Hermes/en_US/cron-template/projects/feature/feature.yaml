# Project work (new feature): Loop mode, one verifiable milestone per run.
# paused: true by default; fill LOOP_PROJECT_DIR, LOOP_GOAL and milestones, then resume.
templateRef: "../../template-cron.yaml"

variables:
  JOB_NAME: "[AAC-Project] Feature delivery"
  SCHEDULE: "0 10 * * 1-5"
  DELIVER: "local"
  LOCALE: "en_US"
  LOOP_MODE_ENABLED: true
  LOOP_TASK_TYPE: "feature"
  LOOP_PROJECT_DIR: "/path/to/your/project"
  LOOP_STATE_FILE: "{{LOOP_PROJECT_DIR}}/.state/feature.json"
  LOOP_GOAL: "Deliver the agreed feature milestone by milestone with reviewable test evidence"
  LOOP_MILESTONES:
    - "Milestone 1: read the current implementation and conventions, write the change plan and blast radius"
    - "Milestone 2: implement the core change and make the related unit tests pass"
    - "Milestone 3: add regression coverage and docs, then state the acceptance result and gaps"
  LOOP_AUTO_PAUSE: false
  LOOP_JOB_ID: ""
  SCENE_SPECIFIC_INSTRUCTIONS: |
    Advance one agreed feature inside `{{LOOP_PROJECT_DIR}}`, one reviewable step at a time.
    Modify repository files only with explicit approval from the user; without it, stay read-only and return a plan.
    Before touching anything, capture user changes: record the raw `git status` and `git diff --stat` output in this run's report so unrelated work is never overwritten or reverted.
    End each run with the changed files, the verification commands, and their real output; never present an unrun check as passing.
    Do not commit, push, switch branches, or bump versions unless the user authorized it for this run.
    For a durable record, write `{{HERMES_HOME}}/docs/reports/projects/feature/<YYYY-MM-DD>.md`, appending for repeat runs, with milestone, scope, evidence, and next step.
    Stop and explain when the requirement is unclear, a dependency is missing, or the change conflicts with existing conventions; do not guess the design.

job:
  name: "{{JOB_NAME}}"
  schedule: "{{SCHEDULE}}"
  deliver: "local"
  catch_up: false
  workdir: "{{LOOP_PROJECT_DIR}}"
  continuity: true
  paused: true
  paused_reason: "Waiting for LOOP_PROJECT_DIR, LOOP_GOAL, and milestones to be filled in; resume afterwards"
